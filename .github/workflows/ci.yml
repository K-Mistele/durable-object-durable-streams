name: CI

on:
    pull_request:
    push:
        branches: [main]

# a new push to a PR cancels the run for its previous commit
concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Format, lint and types
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            # vp check (format, oxlint, types) and typed-lint
            - run: bun run check

    test:
        name: Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            # every package; packages/cloudflare runs the Stack in workerd (alchemy dev), so it
            # needs no Cloudflare account, and runs the conformance suite there
            - run: bun run test
